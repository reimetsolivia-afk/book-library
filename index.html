<!doctype html>
<html>
<head>
    <title>The Little Library</title>

    <style>
        body {
            background-color: #F5EBD8;
            text-align: center;
            font-family: Georgia, serif;
            color: #49382F;
        }

        canvas {
            background-color: #F9F3E8;
            border: 2px solid #B99A72;
        }
    </style>

    <script>

        // Function for drawing one book
        function drawBook(g, x, y, width, height, color, title, rating) {

            // Main book cover
            g.fillStyle = color;
            g.fillRect(x, y, width, height);

            // Dark spine
            g.fillStyle = "#3D2928";
            g.fillRect(x, y, width * 0.15, height);

            // Book outline
            g.strokeStyle = "#D4AF65";
            g.lineWidth = 2;
            g.strokeRect(x, y, width, height);

            // Golden inner border
            g.strokeRect(
                x + 6, y + 6,
                width - 12, height - 12
            );

            // Decorative lines at the top
            g.beginPath();
            g.moveTo(x + 10, y + 20);
            g.lineTo(x + width - 10, y + 20);

            // Decorative lines at the bottom
            g.moveTo(x + 10, y + height - 25);
            g.lineTo(x + width - 10, y + height - 25);
            g.stroke();

            // Golden ornament
            g.beginPath();
            g.arc(
                x + width / 2,
                y + 45,
                12, 0, 2 * Math.PI
            );
            g.stroke();

            // Small decorative star
            g.fillStyle = "#E5C477";
            g.font = "18px Georgia";
            g.textAlign = "center";
            g.fillText("✦", x + width / 2, y + 51);

            // Book title (vertical)
            g.save();

            g.translate(
                x + width / 2,
                y + height / 2
            );

            g.rotate(-Math.PI / 2);

            g.fillStyle = "#FFF0C5";
            g.font = "14px Georgia";
            g.textAlign = "center";

            g.fillText(title, 0, 5, height - 65);

            g.restore();

            // Rating stars
            g.fillStyle = "#F5D477";
            g.font = "12px Arial";
            g.textAlign = "center";

            let stars = "";

            for (let i = 0; i < rating; i++) {
                stars = stars + "★";
            }

            g.fillText(
                stars,
                x + width / 2,
                y + height - 12
            );
        }


        // Function for drawing the library
        function joonista() {

            let g = tahvel.getContext("2d");

            // Clear the canvas
            g.clearRect(0, 0, 800, 450);

            // Background
            g.fillStyle = "#F9F3E8";
            g.fillRect(0, 0, 800, 450);

            // Draw five books
            drawBook(g, 80, 100, 90, 230,
                "#8E3B46", "Dracula", 5);

            drawBook(g, 195, 60, 90, 270,
                "#426344", "The Hobbit", 5);

            drawBook(g, 310, 90, 90, 240,
                "#354B68", "Sherlock Holmes", 4);

            drawBook(g, 425, 130, 90, 200,
                "#BD8146", "The Notebook", 3);

            drawBook(g, 540, 80, 90, 250,
                "#92566D", "Pride and Prejudice", 5);

            // Bookshelf
            g.fillStyle = "#76513B";
            g.fillRect(55, 330, 610, 18);

            g.strokeStyle = "#49382F";
            g.lineWidth = 2;
            g.strokeRect(55, 330, 610, 18);

            // Website title
            g.fillStyle = "#49382F";
            g.font = "28px Georgia";
            g.textAlign = "center";
            g.fillText("The Little Library", 400, 40);

            // Subtitle
            g.font = "italic 15px Georgia";
            g.fillText("Every book leaves a mark.", 400, 385);

        }

    </script>
</head>

<body onload="joonista()">

    <h1>The Little Library</h1>

    <canvas id="tahvel" width="800" height="450">
    </canvas>

</body>
</html>
